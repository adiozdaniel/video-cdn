server:
  port: 8082

spring:
  application:
    name: orchestrator-service

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:postgres}:5432/${DATABASE_NAME:cdn}
    username: ${DATABASE_USER:cdn_app}
    password: ${DATABASE_PASSWORD:cdn_password_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092}
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    listener:
      concurrency: 3

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 60000ms

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:videos}

# Orchestrator Configuration
orchestrator:
  worker-timeout-seconds: 600
  max-retries: 3
  consumer-group: orchestrator-group
  consumer-name: ${HOSTNAME:orchestrator-1}

  # Phase 4: Chunking configuration
  chunking:
    enabled: true
    threshold-seconds: 1800  # 30 minutes - videos longer than this will be chunked
    chunk-size-seconds: 120  # 2 minutes per chunk

  # Upload trigger stream (Redis)
  streams:
    trigger: processing-jobs

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.cdn.orchestrator: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
