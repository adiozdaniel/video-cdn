server:
  port: 8082

spring:
  application:
    name: orchestrator-service

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:postgres}:5432/${DATABASE_NAME:cdn}
    username: ${DATABASE_USER:cdn_app}
    password: ${DATABASE_PASSWORD:cdn_password_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:videos}

# Orchestrator Configuration
orchestrator:
  worker-timeout-seconds: 600
  max-retries: 3
  consumer-group: orchestrator-group
  consumer-name: ${HOSTNAME:orchestrator-1}

  # Redis Stream names
  streams:
    trigger: processing-jobs
    completed: processing-jobs-completed
    profile-480p: processing-jobs-480p
    profile-720p: processing-jobs-720p
    profile-1080p: processing-jobs-1080p
    profile-360p: processing-jobs-360p
    profile-240p: processing-jobs-240p

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.cdn.orchestrator: INFO
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
