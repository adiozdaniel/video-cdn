spring:
  application:
    name: video-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cdn}
    username: ${DB_USER:cdn_app}
    password: ${DB_PASSWORD:cdn_password_2024}
    pool:
      max-size: 20
      initial-size: 5
      max-idle-time: 30m

server:
  port: 8081
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cdn.videoservice: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
