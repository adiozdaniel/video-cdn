version: '3.8'

services:
  # ==========================================
  # LOAD BALANCER - HAProxy (L7 Routing)
  # ==========================================
  haproxy:
    image: haproxy:2.9-alpine
    container_name: cdn-haproxy
    ports:
      - "80:80"
      - "8404:8404"  # Stats page
    volumes:
      - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - upload-service
      - nginx-edge
    networks:
      - cdn-network
    restart: unless-stopped

  # ==========================================
  # UPLOAD SERVICE - Rust (High Performance)
  # ==========================================
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: cdn-upload-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cdn_app
      - DB_PASSWORD=cdn_password_2024
      - DB_NAME=cdn
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # CDN EDGE - Nginx (Content Delivery)
  # ==========================================
  nginx-edge:
    image: nginx:1.25-alpine
    container_name: cdn-nginx-edge
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/cache:/data/nginx/cache
    depends_on:
      - minio
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ==========================================
  # PROCESSING WORKER - Rust + FFmpeg
  # ==========================================
  worker-1:
    build:
      context: ./processing-worker
      dockerfile: Dockerfile
    container_name: cdn-worker-1
    environment:
      - WORKER_ID=worker-1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cdn_app
      - DB_PASSWORD=cdn_password_2024
      - DB_NAME=cdn
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - REDIS_ADDR=redis:6379
      - WORKER_CONCURRENCY=4
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ==========================================
  # INFRASTRUCTURE - PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: cdn-postgres
    environment:
      - POSTGRES_DB=cdn
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_admin_2024
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5242kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # ==========================================
  # INFRASTRUCTURE - MinIO (Object Storage)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: cdn-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    networks:
      - cdn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # INFRASTRUCTURE - Redis (Queue + Cache)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: cdn-redis
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G

  # ==========================================
  # INFRASTRUCTURE - Apache Kafka (Event Streaming)
  # KRaft mode - No ZooKeeper required
  # ==========================================
  kafka-1:
    image: apache/kafka:3.9.0
    container_name: cdn-kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: cdn-kafka-cluster-001
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: cdn-kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: cdn-kafka-cluster-001
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: cdn-kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: cdn-kafka-cluster-001
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ==========================================
  # INFRASTRUCTURE - ClickHouse (Analytics Database)
  # ==========================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.11-alpine
    container_name: cdn-clickhouse
    environment:
      - CLICKHOUSE_DB=cdn_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse_password_2024
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    networks:
      - cdn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

# ==========================================
# NETWORKS
# ==========================================
networks:
  cdn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local
  kafka-1-data:
    driver: local
  kafka-2-data:
    driver: local
  kafka-3-data:
    driver: local
  clickhouse-data:
    driver: local
