global
    maxconn 50000
    log stdout format raw local0

    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 1024

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s

    # Compression for API responses
    compression algo gzip
    compression type text/html text/plain text/css application/json

# ==========================================
# STATS PAGE
# ==========================================
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# ==========================================
# MAIN HTTP FRONTEND
# ==========================================
frontend http_front
    bind *:80

    # Handle OPTIONS preflight with CORS headers
    http-request return status 204 content-type text/plain hdr Access-Control-Allow-Origin "*" hdr Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD" hdr Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" hdr Access-Control-Max-Age "86400" if METH_OPTIONS

    # CORS headers for all other responses
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD"
    http-response set-header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    http-response set-header Access-Control-Max-Age "86400"

    # Define ACLs for path-based routing
    acl is_upload path_beg /api/upload
    acl is_videos_api path_beg /api/videos
    acl is_jobs path_beg /api/jobs
    acl is_analytics path_beg /api/analytics
    acl is_stream path_beg /api/stream
    acl is_drm path_beg /drm
    acl is_admin path_beg /admin
    acl is_cdn_videos path_beg /videos
    acl is_minio_api path_beg /minio-api
    acl is_health path /health

    # Route to appropriate backend
    use_backend upload_service if is_upload
    use_backend video_service if is_videos_api
    use_backend job_service if is_jobs
    use_backend analytics_service if is_analytics
    use_backend streaming_service if is_stream
    use_backend drm_service if is_drm
    use_backend cms_service if is_admin
    use_backend cdn_edge if is_cdn_videos
    use_backend minio_backend if is_minio_api
    use_backend upload_service if is_health

    # Default to portal service (public catalog)
    default_backend portal_service

# ==========================================
# UPLOAD SERVICE BACKEND
# ==========================================
backend upload_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server upload1 upload-service:8080 check inter 10s fall 3 rise 2

# ==========================================
# CDN EDGE BACKEND (Nginx)
# ==========================================
backend cdn_edge
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # Enable caching at proxy level
    http-response set-header X-CDN-Cache HIT if { res.hdr(X-Cache-Status) hit }

    server edge1 nginx-edge:80 check inter 10s fall 3 rise 2

# ==========================================
# MINIO BACKEND (Object Storage API)
# ==========================================
backend minio_backend
    balance roundrobin
    server minio1 minio:9000 check inter 10s

# ==========================================
# VIDEO SERVICE BACKEND (Java/Spring Boot)
# ==========================================
backend video_service
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200

    server video1 video-service:8081 check inter 10s fall 3 rise 2

# ==========================================
# JOB SERVICE BACKEND (Java/Spring Boot)
# ==========================================
backend job_service
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200

    server job1 job-service:8082 check inter 10s fall 3 rise 2 init-addr none

# ==========================================
# ANALYTICS SERVICE BACKEND (Java/Spring Boot)
# ==========================================
backend analytics_service
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200

    server analytics1 analytics-service:8084 check inter 10s fall 3 rise 2 init-addr none

# ==========================================
# STREAMING SERVICE BACKEND (Rust)
# ==========================================
backend streaming_service
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # Enable caching headers
    http-response set-header Cache-Control "public, max-age=10" if { path_end .m3u8 }
    http-response set-header Cache-Control "public, max-age=31536000, immutable" if { path_end .ts }
    http-response set-header Cache-Control "public, max-age=31536000, immutable" if { path_end .m4s }

    server streaming1 streaming-service:8085 check inter 10s fall 3 rise 2 init-addr none

# ==========================================
# DRM SERVICE BACKEND (CMS/Laravel)
# ==========================================
backend drm_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server drm1 drm-service:8083 check inter 10s fall 3 rise 2 init-addr none

# ==========================================
# CMS SERVICE BACKEND (CMS/Laravel)
# ==========================================
backend cms_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # Sticky sessions for admin panel
    cookie CMSSESSID insert indirect nocache

    server cms1 cms-service:8082 cookie cms1 check inter 10s fall 3 rise 2 init-addr none

# ==========================================
# PORTAL SERVICE BACKEND (CMS/Laravel)
# ==========================================
backend portal_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server portal1 portal-service:8082 check inter 10s fall 3 rise 2 init-addr none
