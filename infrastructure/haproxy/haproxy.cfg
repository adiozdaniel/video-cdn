global
    maxconn 50000
    log stdout format raw local0

    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 1024

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s

    # Compression for API responses
    compression algo gzip
    compression type text/html text/plain text/css application/json

# ==========================================
# STATS PAGE
# ==========================================
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# ==========================================
# MAIN HTTP FRONTEND
# ==========================================
frontend http_front
    bind *:80

    # CORS headers for all responses
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD"
    http-response set-header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    http-response set-header Access-Control-Max-Age "86400"

    # Handle OPTIONS preflight
    http-request return status 204 if METH_OPTIONS

    # Define ACLs for path-based routing
    acl is_upload path_beg /api/upload
    acl is_videos path_beg /videos
    acl is_minio_api path_beg /minio-api
    acl is_health path /health

    # Route to appropriate backend
    use_backend upload_service if is_upload
    use_backend cdn_edge if is_videos
    use_backend minio_backend if is_minio_api
    use_backend upload_service if is_health

    # Default to upload service for now
    default_backend upload_service

# ==========================================
# UPLOAD SERVICE BACKEND
# ==========================================
backend upload_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server upload1 upload-service:8080 check inter 10s fall 3 rise 2

# ==========================================
# CDN EDGE BACKEND (Nginx)
# ==========================================
backend cdn_edge
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # Enable caching at proxy level
    http-response set-header X-CDN-Cache HIT if { res.hdr(X-Cache-Status) hit }

    server edge1 nginx-edge:80 check inter 10s fall 3 rise 2

# ==========================================
# MINIO BACKEND (Object Storage API)
# ==========================================
backend minio_backend
    balance roundrobin
    server minio1 minio:9000 check inter 10s
