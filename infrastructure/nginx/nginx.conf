user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Performance tuning
worker_rlimit_nofile 65535;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cache:$upstream_cache_status rt:$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-mpegurl video/mp2t;

    # Cache configuration
    proxy_cache_path /data/nginx/cache
                     levels=1:2
                     keys_zone=video_cache:100m
                     max_size=50g
                     inactive=365d
                     use_temp_path=off;

    # Upstream to MinIO
    upstream minio_backend {
        server minio:9000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Video segments (HLS .ts files and DASH .m4s files)
        location ~ ^/videos/.+\.(ts|m4s)$ {
            # Proxy to MinIO
            proxy_pass http://minio_backend;

            # Caching - 1 year for immutable segments
            proxy_cache video_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_key "$scheme$request_uri";
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Cache headers
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";

            # Performance
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # MinIO headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Manifest files (HLS .m3u8 and DASH .mpd)
        location ~ ^/videos/.+\.(m3u8|mpd)$ {
            # Proxy to MinIO
            proxy_pass http://minio_backend;

            # Caching - short TTL for manifests (can update)
            proxy_cache video_cache;
            proxy_cache_valid 200 10s;
            proxy_cache_key "$scheme$request_uri";
            proxy_cache_lock on;

            # Cache headers
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=10";
            add_header Access-Control-Allow-Origin "*";

            # Performance
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # MinIO headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Other video assets (thumbnails, subtitles, etc.)
        location ~ ^/videos/ {
            # Proxy to MinIO
            proxy_pass http://minio_backend;

            # Caching - medium TTL
            proxy_cache video_cache;
            proxy_cache_valid 200 1d;
            proxy_cache_key "$scheme$request_uri";

            # Cache headers
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400";
            add_header Access-Control-Allow-Origin "*";

            # Performance
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # MinIO headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
